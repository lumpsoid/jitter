name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

# Keep in step with ci.yml, windows.yml, android.yml, linux.yml and
# packaging/appimage/Containerfile.
env:
  RUST_VERSION: 1.93.1
  FLUTTER_VERSION: 3.47.8
  RINF_VERSION: 8.11.0

jobs:
  version:
    name: Check the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          full=$(scripts/version.sh show)
          version=${full%+*}
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  android:
    name: Android
    needs: version
    # android.yml's share job asks for write; it only runs when android.yml
    # is dispatched by hand, but a caller must still allow it.
    permissions:
      contents: write
    uses: ./.github/workflows/android.yml
    secrets: inherit
    with:
      version: ${{ needs.version.outputs.version }}

  linux:
    name: Linux
    needs: version
    # linux.yml's share job asks for write; it only runs when linux.yml is
    # dispatched by hand, but a caller must still allow it.
    permissions:
      contents: write
    uses: ./.github/workflows/linux.yml
    with:
      version: ${{ needs.version.outputs.version }}

  windows:
    name: Windows
    needs: version
    # windows.yml's share job asks for write; it only runs when windows.yml
    # is dispatched by hand, but a caller must still allow it.
    permissions:
      contents: write
    uses: ./.github/workflows/windows.yml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    name: Publish the release
    needs: [version, android, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS
      # checkout leaves the tag lightweight; fetch it again to read the
      # changelog section release.sh put in its annotation.
      - name: Release notes
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > notes.md
          cat notes.md
          test -s notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: Jitter ${{ needs.version.outputs.version }}
          body_path: notes.md
          files: out/*
          fail_on_unmatched_files: true
