name: Windows

# The Windows build. release.yml calls it for a release; run it by hand
# (Actions > Windows > Run workflow, pick the branch) for a test build of any
# branch, to check a fix on Windows or send it to the user who reported the
# bug. See docs/maintaining.md#test-builds.
on:
  workflow_call:
    inputs:
      version:
        description: The release's version, X.Y.Z
        type: string
        required: true
  workflow_dispatch:
    inputs:
      share:
        description: Publish the zip as a test prerelease anyone can download
        type: boolean
        default: true
      bench:
        description: Build the player bench (bench/bench_app.dart) instead of the app
        type: boolean
        default: false

permissions:
  contents: read

# Keep in step with ci.yml, release.yml, android.yml, linux.yml and
# packaging/appimage/Containerfile.
env:
  RUST_VERSION: 1.93.1
  FLUTTER_VERSION: 3.47.8
  RINF_VERSION: 8.11.0

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    outputs:
      zip: ${{ steps.name.outputs.zip }}
      tag: ${{ steps.name.outputs.tag }}
      bench: ${{ steps.name.outputs.bench }}
    steps:
      - uses: actions/checkout@v4
      # A test build is named after its commit, so it can't pass for a release.
      # The bench is a profile build: Flutter drops dev-dependency plugins
      # (fvp) from release builds. inputs.bench is unset on a release.
      - name: Name the zip
        id: name
        env:
          VERSION: ${{ inputs.version }}
          BENCH: ${{ inputs.bench }}
        run: |
          sha=${GITHUB_SHA::7}
          if [[ -z $VERSION ]]; then
            full=$(scripts/version.sh show)
            VERSION="${full%+*}-test.$sha"
          fi
          if [[ $BENCH == true ]]; then
            prefix=jitter-bench
            is_bench=true
            mode=profile
            target=bench/bench_app.dart
            dir=Profile
            define=--dart-define=JITTER_BENCH_BUILD=$sha
            tag=test-windows-bench-$sha
          else
            prefix=jitter
            is_bench=false
            mode=release
            target=lib/main.dart
            dir=Release
            define=
            tag=test-windows-$sha
          fi
          {
            echo "zip=$prefix-$VERSION-windows-x64.zip"
            echo "bench=$is_bench"
            echo "tag=$tag"
            echo "mode=$mode"
            echo "target=$target"
            echo "dir=$dir"
            echo "define=$define"
          } >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo install rinf_cli --version "$RINF_VERSION" --locked
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: rinf gen
      - name: Build the bundle
        env:
          MODE: ${{ steps.name.outputs.mode }}
          TARGET: ${{ steps.name.outputs.target }}
          DEFINE: ${{ steps.name.outputs.define }}
        run: flutter build windows --$MODE -t $TARGET $DEFINE
      - name: Zip the bundle
        shell: pwsh
        env:
          DIR: ${{ steps.name.outputs.dir }}
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path "build/windows/x64/runner/$env:DIR/*" `
            -DestinationPath "out/${{ steps.name.outputs.zip }}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/
          if-no-files-found: error

  share:
    name: Publish a test prerelease
    if: github.event_name == 'workflow_dispatch' && inputs.share
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      ZIP: ${{ needs.build.outputs.zip }}
      TAG: ${{ needs.build.outputs.tag }}
      BENCH: ${{ needs.build.outputs.bench }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: out
      # One prerelease per commit; a re-run replaces its zip.
      - run: |
          tag=$TAG
          if [[ $BENCH == true ]]; then
            title="Windows player bench ${GITHUB_SHA::7} ($GITHUB_REF_NAME)"
            notes="Not a release: the player bench at $GITHUB_REF_NAME $GITHUB_SHA. Unzip anywhere, run jitter.exe, follow the on-screen steps, then copy the log back. Not code-signed, so SmartScreen may warn the first time."
          else
            title="Windows test build ${GITHUB_SHA::7} ($GITHUB_REF_NAME)"
            notes="Not a release: a test build of $GITHUB_REF_NAME at $GITHUB_SHA, to check a fix before it ships. Unzip anywhere and run jitter.exe. It is not code-signed, so SmartScreen may warn the first time."
          fi
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" -R "$GITHUB_REPOSITORY" --clobber "out/$ZIP"
          else
            gh release create "$tag" -R "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "$title" --notes "$notes" \
              "out/$ZIP"
          fi
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag"
          echo "::notice::$url"
          echo "Test build: $url" >> "$GITHUB_STEP_SUMMARY"
