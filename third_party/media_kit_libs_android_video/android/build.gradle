import java.nio.file.Files
import java.security.MessageDigest

group 'com.alexmercerind.media_kit_libs_android_video'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

// Jitter: built by ../libmpv/build.sh, kept out of git; see
// scripts/libmpv-android.sh.
def libmpvJars = file("../../../dist/libmpv-android")

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'com.alexmercerind.media_kit_libs_android_video'
    }

    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 16
    }

    dependencies {
        implementation fileTree(dir: libmpvJars, include: "*.jar")
    }
}

// Jitter: upstream downloads media-kit's libmpv-android-video-build v1.1.7
// jars here. These are that release rebuilt with two FFmpeg backports (see
// ../libmpv/README.md), read from dist/libmpv-android/ at the repo root and
// checked against the MD5s in ../libmpv/jars.md5, the pins
// scripts/libmpv-android.sh writes and fetches by.
def libmpvPins = file("../libmpv/jars.md5")

task verifyLibmpvJars {
    inputs.file(libmpvPins)
    doLast {
        libmpvPins.readLines().findAll { it.trim() }.each { line ->
            def (md5, name) = line.split(/\s+/, 2)
            def jar = new File(libmpvJars, name)
            if (!jar.exists()) {
                throw new GradleException("Missing ${jar}; run scripts/libmpv-android.sh fetch")
            }
            def actual = MessageDigest.getInstance("MD5").digest(Files.readAllBytes(jar.toPath())).encodeHex().toString()
            if (actual != md5) {
                throw new GradleException("MD5 mismatch for ${jar}: ${actual}, expected ${md5}; run scripts/libmpv-android.sh fetch")
            }
        }
    }
}

preBuild.dependsOn(verifyLibmpvJars)
