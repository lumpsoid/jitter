import java.nio.file.Files
import java.security.MessageDigest

group 'com.alexmercerind.media_kit_libs_android_video'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'com.alexmercerind.media_kit_libs_android_video'
    }

    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 16
    }

    dependencies {
        implementation fileTree(dir: "libs", include: "*.jar")
    }
}

// Jitter: upstream downloads media-kit's libmpv-android-video-build v1.1.7
// jars here. These are that release rebuilt with two FFmpeg backports (see
// ../libmpv/README.md), committed under libs/ and pinned by MD5 like
// upstream's.
task verifyLibmpvJars {
    def jars = [
        "default-arm64-v8a.jar"  : "6c12e38dfa56756c310e37f92b414a11",
        "default-armeabi-v7a.jar": "3fafc94e47ee3a018b0f7e185915ece7",
        "default-x86_64.jar"     : "3ea724c13852964537b8e82129a861f4",
        "default-x86.jar"        : "ff6eb6c7f9d15ba4a35da3f3adaab9e3",
    ]
    doLast {
        jars.each { name, md5 ->
            def jar = file("libs/$name")
            if (!jar.exists()) {
                throw new GradleException("Missing ${jar}")
            }
            def actual = MessageDigest.getInstance("MD5").digest(Files.readAllBytes(jar.toPath())).encodeHex().toString()
            if (actual != md5) {
                throw new GradleException("MD5 mismatch for ${jar}: ${actual}, expected ${md5}")
            }
        }
    }
}

preBuild.dependsOn(verifyLibmpvJars)
