[package]
# Do not change the name of this crate.
name = "hub"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# `lib` is required for non-library targets,
# such as tests and benchmarks.
# `cdylib` is for Linux, Android, Windows, and web.
# `staticlib` is for iOS and macOS.
crate-type = ["lib", "cdylib", "staticlib"]

[lints]
workspace = true

[dependencies]
jitter_core = { path = "../core" }
jitter_store = { path = "../store" }
jitter_twitch = { path = "../twitch" }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
rinf = "8.11.0"
serde = { version = "1.0.219", features = ["derive"] }
tokio = { version = "1.45.0", features = ["rt", "sync", "time", "macros"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
# The fake resume store, for the VOD tiles' resume progress.
jitter_core = { path = "../core", features = ["test-fakes"] }
